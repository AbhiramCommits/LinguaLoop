[project]
name = "lingualoop-tools"
version = "0.1.0"
description = "CLI utilities for the LinguaLoop language-learning platform"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
]
tts = [
    "piper-tts>=1.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
