services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingualoop}
      POSTGRES_USER: ${POSTGRES_USER:-lingualoop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lingualoop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingualoop} -d ${POSTGRES_DB:-lingualoop}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ../api
      dockerfile: ../infra/api.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lingualoop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lingualoop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lingualoop}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789}
      JWT_TTL: ${JWT_TTL:-24h}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
      APP_AUDIO_DIR: /app/audio
    volumes:
      - ../audio:/app/audio
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ../web
      dockerfile: ../infra/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
