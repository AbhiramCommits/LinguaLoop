# Production-oriented stack: built images, pinned versions, healthchecks.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d
# Required in .env: POSTGRES_PASSWORD, JWT_SECRET, APP_ADMIN_EMAILS,
# SPRING_DATASOURCE_URL/… (or set them below via variables), APP_CORS_ORIGINS.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingualoop}
      POSTGRES_USER: ${POSTGRES_USER:-lingualoop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingualoop} -d ${POSTGRES_DB:-lingualoop}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-lingualoop}/lingualoop-api:latest
    build:
      context: ../api
      dockerfile: ../infra/api.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lingualoop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lingualoop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_TTL: ${JWT_TTL:-24h}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-https://lingualoop.example}
      APP_AUDIO_DIR: /app/audio
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
    volumes:
      - audio:/app/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-lingualoop}/lingualoop-web:latest
    build:
      context: ../web
      dockerfile: ../infra/web.Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  audio:
