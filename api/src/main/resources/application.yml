spring:
  application:
    name: lingualoop-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:24h}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  audio:
    directory: ${APP_AUDIO_DIR:./audio}
  experiment:
    variants:
      - key: control
        weight: 1.0
  queue:
    cache-ttl: 5m
    limit: 50
