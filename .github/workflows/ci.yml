name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: API (tests + coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test with Testcontainers + JaCoCo gate (>=75% on scheduler & experiment)
        working-directory: api
        run: ./gradlew check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: api/build/reports/jacoco/test/html/
          if-no-files-found: ignore

  web:
    name: Web (typecheck + lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test
        working-directory: web

  tools:
    name: Tools (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install and check
        working-directory: tools
        run: |
          uv sync
          uv run ruff check .
          uv run pytest

  android:
    name: Android (unit tests + assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install platform + build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingualoop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright + axe against the compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        working-directory: infra
        run: docker compose up -d --build
        env:
          APP_ADMIN_EMAILS: author@e2e.example
      - uses: astral-sh/setup-uv@v5
      - name: Seed content
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
          uv run --project tools python tools/seed.py
        env:
          DATABASE_URL: postgresql://lingualoop:lingualoop@localhost:5432/lingualoop
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run the suite (journey, keyboard-only, axe)
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore

  docker-ghcr:
    name: Push API image to GHCR (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: api
          file: infra/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lingualoop-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/lingualoop-api:latest
